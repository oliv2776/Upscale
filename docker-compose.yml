services:
  uscale:
    build: .
    container_name: uscale
    restart: unless-stopped
    ports:
      - "${USCALE_PORT:-27000}:27000"
    environment:
      USCALE_PORT: "27000"
      USCALE_DATA_ROOT: "${USCALE_DATA_ROOT:-/data}"
      # Chemin de la bibliothèque sur l'hôte : nécessaire pour que le conteneur
      # Video2X (lancé par le daemon Docker de l'hôte) monte le bon dossier.
      USCALE_HOST_DATA: "${USCALE_HOST_DATA:-/data}"
      VIDEO2X_IMAGE: "${VIDEO2X_IMAGE:-ghcr.io/k4yt3x/video2x:6.4.0}"
      VIDEO2X_GPU: "${VIDEO2X_GPU:-}"
      VIDEO_GID: "${VIDEO_GID:-44}"
      RENDER_GID: "${RENDER_GID:-109}"
      DEFAULT_SOURCE: "${DEFAULT_SOURCE:-/data/videos}"
      DEFAULT_DESTINATION: "${DEFAULT_DESTINATION:-/data/videos_upscaled}"
      USCALE_USER: "${USCALE_USER:-admin}"
      USCALE_PASSWORD: "${USCALE_PASSWORD:-}"
      USCALE_MIN_FREE_GB: "${USCALE_MIN_FREE_GB:-5}"
      USCALE_TRUSTED_HOSTS: "${USCALE_TRUSTED_HOSTS:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${USCALE_HOST_DATA:-/data}:${USCALE_DATA_ROOT:-/data}
      - uscale-state:/app/state
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"
    security_opt:
      - no-new-privileges:true

volumes:
  uscale-state:
