services:
  upscale:
    # Par défaut l'image est construite localement (pull_policy: build).
    # UPSCALE_PULL_POLICY=always utilise l'image publiée sur GHCR (voir README).
    image: ghcr.io/oliv2776/upscale:${UPSCALE_VERSION:-${USCALE_VERSION:-latest}}
    pull_policy: ${UPSCALE_PULL_POLICY:-${USCALE_PULL_POLICY:-build}}
    build: .
    container_name: upscale
    restart: unless-stopped
    ports:
      - "${UPSCALE_PORT:-${USCALE_PORT:-27000}}:27000"
    environment:
      UPSCALE_PORT: "27000"
      UPSCALE_DATA_ROOT: "${UPSCALE_DATA_ROOT:-${USCALE_DATA_ROOT:-/data}}"
      # Chemin de la bibliothèque sur l'hôte : nécessaire pour que le conteneur
      # Video2X (lancé par le daemon Docker de l'hôte) monte le bon dossier.
      UPSCALE_HOST_DATA: "${UPSCALE_HOST_DATA:-${USCALE_HOST_DATA:-/data}}"
      VIDEO2X_IMAGE: "${VIDEO2X_IMAGE:-ghcr.io/k4yt3x/video2x:6.4.0}"
      VIDEO2X_GPU: "${VIDEO2X_GPU:-}"
      VIDEO_GID: "${VIDEO_GID:-44}"
      RENDER_GID: "${RENDER_GID:-109}"
      VAAPI_DEVICE: "${VAAPI_DEVICE:-/dev/dri/renderD128}"
      DEFAULT_SOURCE: "${DEFAULT_SOURCE:-/data/videos}"
      DEFAULT_DESTINATION: "${DEFAULT_DESTINATION:-/data/videos_upscaled}"
      UPSCALE_USER: "${UPSCALE_USER:-${USCALE_USER:-admin}}"
      UPSCALE_PASSWORD: "${UPSCALE_PASSWORD:-${USCALE_PASSWORD:-}}"
      UPSCALE_ALLOW_ANONYMOUS: "${UPSCALE_ALLOW_ANONYMOUS:-0}"
      UPSCALE_TRUSTED_HOSTS: "${UPSCALE_TRUSTED_HOSTS:-${USCALE_TRUSTED_HOSTS:-}}"
      UPSCALE_ALLOW_PRIVATE_MODEL_URLS: "${UPSCALE_ALLOW_PRIVATE_MODEL_URLS:-0}"
      UPSCALE_CONVERTER_DROP_PRIVILEGES: "${UPSCALE_CONVERTER_DROP_PRIVILEGES:-1}"
      HOME: "/tmp"
      UPSCALE_MIN_FREE_GB: "${UPSCALE_MIN_FREE_GB:-${USCALE_MIN_FREE_GB:-5}}"
      UPSCALE_SEGMENT_SECONDS: "${UPSCALE_SEGMENT_SECONDS:-${USCALE_SEGMENT_SECONDS:-180}}"
      UPSCALE_LOG_RETENTION_DAYS: "${UPSCALE_LOG_RETENTION_DAYS:-${USCALE_LOG_RETENTION_DAYS:-90}}"
      PUID: "${PUID:-}"
      PGID: "${PGID:-}"
      TZ: "${TZ:-Europe/Paris}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${UPSCALE_HOST_DATA:-${USCALE_HOST_DATA:-/data}}:${UPSCALE_DATA_ROOT:-${USCALE_DATA_ROOT:-/data}}
      - uscale-state:/app/state
    # /dev/dri : encodage matériel VAAPI et statistiques du GPU.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"
    security_opt:
      - no-new-privileges:true
    # Durcissement : système de fichiers en lecture seule, capacités minimales, /tmp en mémoire.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    pids_limit: 512
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  uscale-state:
