name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install Python dependencies
        run: |
          pip install -r requirements-dev.txt
          # Pour tester l'écriture ncnn directe face à PyTorch (convertisseur de modèles).
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install spandrel ncnn
      - name: Lint Python
        run: ruff check .
      - name: Tests
        run: pytest -q
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check browser JavaScript
        run: node --check static/app.js
      - name: Check installer
        run: |
          bash -n install.sh
          shellcheck install.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t upscale:ci .
      - name: Smoke test
        run: |
          docker run -d --name upscale-ci -p 27000:27000 upscale:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:27000/api/ping && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:27000/ | grep -q Upscale
          curl -fsS http://127.0.0.1:27000/api/config | grep -q '"version"'
          docker exec upscale-ci docker --version
          docker exec upscale-ci ffmpeg -hide_banner -encoders | grep -E "libx265|libsvtav1|hevc_vaapi"
          docker exec upscale-ci sh -c '/opt/upscayl/upscayl-bin -h 2>&1 | head -n 20' | grep -i -- "-z model-scale"
          docker rm -f upscale-ci
      - name: Install real OpenModelDB models and upscale with them (CPU Vulkan)
        run: |
          mkdir -p ci-data/videos
          docker run --rm -v "$PWD/ci-data:/data" --entrypoint ffmpeg upscale:ci -v error \
            -f lavfi -i testsrc2=size=160x120:rate=10:duration=2 -c:v libx264 -pix_fmt yuv420p /data/videos/clip.mp4
          docker run -d --name upscale-models -p 27004:27000 -v "$PWD/ci-data:/data" \
            -e UPSCALE_MIN_FREE_GB=0 -e UPSCALE_CUSTOM_SEGMENT_SECONDS=1 upscale:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:27004/api/ping && break; sleep 1; done
          install() {
            curl -fsS -X POST -H "Content-Type: application/json" http://127.0.0.1:27004/api/models/install -d "$1" > start.json
            id=$(python3 -c "import json; print(json.load(open('start.json'))['install']['id'])")
            for i in $(seq 1 240); do
              sleep 5
              curl -fsS "http://127.0.0.1:27004/api/models/installs/$id" > task.json
              python3 -c "import json; t=json.load(open('task.json'))['install']; print(t['state'], t['step'], t['progress'])"
              python3 -c "import json,sys; sys.exit(0 if json.load(open('task.json'))['install']['state'] in ('done','error') else 1)" && break
            done
            python3 -c "import json; t=json.load(open('task.json'))['install']; print('\n'.join(t['log'])); print('=>', t['state'], t['message'])"
            python3 -c "import json,sys; sys.exit(0 if json.load(open('task.json'))['install']['state'] == 'done' else 1)"
          }
          # Modèle conseillé dans l'interface : il doit s'installer, se convertir et passer la vérification.
          install '{"source":"https://openmodeldb.info/models/2x-LiveActionV1-SPAN"}'
          docker exec upscale-models sh -c '/app/state/convertisseur/bin/pip list 2>/dev/null | grep -i -E "^(torch|torchvision|spandrel|pnnx|onnx|numpy) "'
          # Autres architectures courantes (informatif : sources externes, dont Google Drive).
          install '{"source":"https://openmodeldb.info/models/2x-NomosUni-compact-multijpg"}' || echo "::warning::NomosUni compact non installé"
          # ESRGAN (écriture ncnn directe, sans pnnx) : doit s'installer et passer la vérification.
          install '{"source":"https://openmodeldb.info/models/4x-realesrgan-x4plus"}'
          curl -fsS http://127.0.0.1:27004/api/models | python3 -m json.tool | head -n 80
          model=$(curl -fsS http://127.0.0.1:27004/api/models | python3 -c "import json,sys; print(next(k for k,v in json.load(sys.stdin)['models'].items() if v.get('page','').endswith('2x-LiveActionV1-SPAN')))")
          curl -fsS -X POST -H "Content-Type: application/json" http://127.0.0.1:27004/api/queue \
            -d "{\"source\":\"/data/videos\",\"destination\":\"/data/out\",\"max_input_height\":480,\"output_height\":240,\"model\":\"$model\",\"preset\":\"ultrafast\"}"
          for i in $(seq 1 120); do
            sleep 5
            curl -fsS http://127.0.0.1:27004/api/jobs > all.json
            python3 -c "import json; print([(j['status'], j['stage'], j['progress']) for j in json.load(open('all.json'))['jobs']])"
            python3 -c "import json,sys; j=json.load(open('all.json'))['jobs']; sys.exit(0 if j and j[0]['status'] in ('completed','failed') else 1)" && break
          done
          id=$(python3 -c "import json; print(json.load(open('all.json'))['jobs'][0]['id'])")
          curl -fsS "http://127.0.0.1:27004/api/logs/$id" | python3 -c "import json,sys; print(json.load(sys.stdin)['log'][-4000:])"
          docker rm -f upscale-models
          python3 -c "import json,sys; j=json.load(open('all.json'))['jobs'][0]; sys.exit(0 if j['status']=='completed' else 1)"
          docker run --rm -v "$PWD/ci-data:/data" --entrypoint ffprobe upscale:ci -v error \
            -show_entries stream=codec_name,width,height -of csv /data/out/clip.mkv | tee probe.txt
          grep -q ",320,240" probe.txt

  docker-local:
    # Variante sans socket Docker (Video2X AppImage dans l'image) : vérifie qu'elle se construit et démarre.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -f Dockerfile.local -t upscale-local:ci .
      - name: Video2X runs
        run: |
          docker run --rm --entrypoint /opt/video2x/AppRun upscale-local:ci --help > help.txt
          cat help.txt
          grep -q -- "--list-devices" help.txt
          grep -q -- "--frame-rate-mul" help.txt
          for model in realesrgan-plus realesrgan-plus-anime realesr-animevideov3; do
            grep -q "$model" help.txt || { echo "Modèle absent : $model"; exit 1; }
          done
      - name: Sample ncnn model (realesr-animevideov3 x2) for the custom-model engine
        run: |
          curl -fsSL -o ncnn.zip https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip
          mkdir -p ncnn-models && unzip -j -o ncnn.zip "*/realesr-animevideov3-x2.*" -d ncnn-models || unzip -j -o ncnn.zip "*realesr-animevideov3-x2.*" -d ncnn-models
          ls -la ncnn-models
      - name: Real Video2X on CPU Vulkan (lavapipe)
        run: |
          docker run --rm -v "$PWD/ncnn-models:/tmp/xmodels:ro" --entrypoint sh -w /usr/share/video2x upscale-local:ci -c '
            set -e
            ls -la /usr/share/video2x/models/ /usr/share/video2x/models/realesrgan | head -n 30
            ffmpeg -v error -f lavfi -i testsrc=size=96x64:rate=10:duration=1 -c:v libx264 -pix_fmt yuv420p /tmp/in.mp4
            /opt/video2x/AppRun --list-devices
            /opt/video2x/AppRun -i /tmp/in.mp4 -o /tmp/up.mkv -p realesrgan -s 2 --realesrgan-model realesr-animevideov3 -c ffv1 2>&1 | tr "\r" "\n" | tail -n 25
            ffprobe -v error -show_entries stream=codec_name,width,height -of csv /tmp/up.mkv
            ffmpeg -v error -i /tmp/in.mp4 -c:v ffv1 -g 1 /tmp/in.mkv
            /opt/video2x/AppRun -i /tmp/in.mkv -o /tmp/rife.mkv -p rife --frame-rate-mul 2 -c ffv1 2>&1 | tr "\r" "\n" | tail -n 8
            frames=$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 /tmp/rife.mkv)
            echo "RIFE : $frames images (attendu : 20)"
            /opt/video2x/AppRun -i /tmp/in.mkv -o /tmp/up2.mkv -p realesrgan -s 2 --realesrgan-model realesr-animevideov3 -c ffv1 > /dev/null 2>&1
            up=$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 /tmp/up2.mkv)
            echo "Real-ESRGAN depuis FFV1 : $up images (attendu : 10)"
            test "$up" = 10
            echo "== upscayl-bin (modèles personnalisés)"
            mkdir -p /tmp/models/perso && cp /tmp/xmodels/realesr-animevideov3-x2.param /tmp/models/perso/modele.param
            cp /tmp/xmodels/realesr-animevideov3-x2.bin /tmp/models/perso/modele.bin
            mkdir -p /tmp/fin /tmp/fout && ffmpeg -v error -i /tmp/in.mp4 -frames:v 2 -start_number 0 /tmp/fin/%08d.png
            /opt/upscayl/upscayl-bin -i /tmp/fin -o /tmp/fout -m /tmp/models/perso -n modele -z 2 -f png
            ls /tmp/fout && ffprobe -v error -show_entries stream=width,height -of csv /tmp/fout/00000000.png
          '
      - name: Full pipeline with real Video2X (local mode)
        run: |
          mkdir -p ci-data/videos
          docker run --rm -v "$PWD/ci-data:/data" --entrypoint ffmpeg upscale-local:ci -v error \
            -f lavfi -i testsrc=size=160x120:rate=10:duration=3 -f lavfi -i sine=duration=3 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac /data/videos/clip.mp4
          docker run -d --name upscale-e2e -p 27002:27000 -v "$PWD/ci-data:/data" \
            -e UPSCALE_SEGMENT_SECONDS=1 -e UPSCALE_MIN_FREE_GB=0 upscale-local:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:27002/api/ping && break; sleep 1; done
          run_job() {
            curl -fsS -X POST -H "Content-Type: application/json" http://127.0.0.1:27002/api/queue -d "$1"
            for i in $(seq 1 120); do
              sleep 5
              curl -fsS "http://127.0.0.1:27002/api/jobs?status=$2" > jobs.json || true
              curl -fsS "http://127.0.0.1:27002/api/jobs" > all.json
              python3 -c "import json; j=json.load(open('all.json'))['jobs']; print(j and (j[0]['status'], j[0]['stage'], j[0]['progress']))"
              python3 -c "import json,sys; j=json.load(open('all.json'))['jobs']; sys.exit(0 if j and j[0]['status'] in ('completed','failed') else 1)" && break
            done
            id=$(python3 -c "import json; print(json.load(open('all.json'))['jobs'][0]['id'])")
            curl -fsS "http://127.0.0.1:27002/api/logs/$id" | python3 -c "import json,sys; print(json.load(sys.stdin)['log'][-6000:])"
            python3 -c "import json,sys; j=json.load(open('all.json'))['jobs'][0]; print('ATTENTION', j['warning']) if j['warning'] else None; sys.exit(0 if j['status']=='completed' and not j['warning'] else 1)"
          }
          run_job '{"source":"/data/videos","destination":"/data/out","max_input_height":480,"output_height":240,"model":"realesr-animevideov3","preset":"ultrafast"}'
          run_job '{"source":"/data/videos","destination":"/data/out2","max_input_height":480,"output_height":240,"model":"realesr-animevideov3","preset":"ultrafast","interpolate":2,"denoise":"light","codec":"hevc","output_suffix":" - IA","render":"peau-normale"}'
          # Modèle ncnn importé par l'API (comme depuis l'interface) : moteur upscayl-bin.
          cp ncnn-models/realesr-animevideov3-x2.param perso.param && cp ncnn-models/realesr-animevideov3-x2.bin perso.bin
          curl -fsS -X POST -H "X-Upscale-Upload: 1" -F label="Test perso" -F scale=2 -F tile=0 \
            -F param=@perso.param -F bin=@perso.bin http://127.0.0.1:27002/api/models
          run_job '{"source":"/data/videos","destination":"/data/out3","max_input_height":480,"output_height":240,"model":"perso-test-perso","preset":"ultrafast","render":"custom","ai_strength":80,"grain":"medium","output_suffix":"","interpolate":1}'
          docker rm -f upscale-e2e
          for f in "out/clip.mkv" "out2/clip - IA.mkv" "out3/clip.mkv"; do
            docker run --rm -v "$PWD/ci-data:/data" --entrypoint ffprobe upscale-local:ci -v error -count_frames \
              -show_entries stream=codec_type,codec_name,width,height,avg_frame_rate,nb_read_frames:format=duration -of csv "/data/$f"
          done
      - name: Smoke test
        run: |
          docker run -d --name upscale-local -p 27001:27000 upscale-local:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:27001/api/ping && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:27001/api/health | tee health.json
          grep -q '"runner":"local"' health.json
          grep -q '"image_present":true' health.json
          docker rm -f upscale-local

  docker-socket-e2e:
    # Mode standard : Upscale pilote le conteneur officiel Video2X via le socket Docker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t upscale:ci .
      - name: Full pipeline with the official Video2X image
        run: |
          sudo mkdir -p /dev/dri
          docker pull ghcr.io/k4yt3x/video2x:6.4.0
          docker run --rm --entrypoint sh ghcr.io/k4yt3x/video2x:6.4.0 -c 'cat /etc/os-release | head -n 2; ls /usr/share/vulkan/icd.d/ 2>/dev/null' || true
          # Deux disques : /data et un disque supplémentaire monté dans /disques/Disque2 (comme bibliotheques.sh).
          mkdir -p ci-data/videos ci-disk2/Series
          for target in "ci-data:/data/videos/clip.mp4" "ci-disk2:/data/Series/episode.mp4"; do
            docker run --rm -v "$PWD/${target%%:*}:/data" --entrypoint ffmpeg upscale:ci -v error \
              -f lavfi -i testsrc=size=160x120:rate=10:duration=2 -f lavfi -i sine=duration=2 \
              -c:v libx264 -pix_fmt yuv420p -c:a aac "${target#*:}"
          done
          docker run -d --name upscale-socket -p 27003:27000 \
            -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/ci-data:/data" -v "$PWD/ci-disk2:/disques/Disque2" \
            -e UPSCALE_SEGMENT_SECONDS=1 -e UPSCALE_MIN_FREE_GB=0 upscale:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:27003/api/ping && break; sleep 1; done
          curl -fsS http://127.0.0.1:27003/api/browse | python3 -m json.tool
          curl -fsS -X POST -H "Content-Type: application/json" http://127.0.0.1:27003/api/health/gpu -d '{}'
          curl -fsS -X POST -H "Content-Type: application/json" http://127.0.0.1:27003/api/queue \
            -d '{"sources":["/data/videos","/disques/Disque2/Series"],"destination":"/data/out","max_input_height":480,"output_height":240,"model":"realesr-animevideov3","preset":"ultrafast"}'
          for i in $(seq 1 120); do
            sleep 5
            curl -fsS http://127.0.0.1:27003/api/jobs > all.json
            python3 -c "import json; print([(j['status'], j['stage'], j['progress']) for j in json.load(open('all.json'))['jobs']])"
            python3 -c "import json,sys; j=json.load(open('all.json'))['jobs']; sys.exit(0 if len(j) == 2 and all(x['status'] in ('completed','failed') for x in j) else 1)" && break
          done
          curl -fsS http://127.0.0.1:27003/api/health | python3 -m json.tool
          for id in $(python3 -c "import json; print(' '.join(j['id'] for j in json.load(open('all.json'))['jobs']))"); do
            curl -fsS "http://127.0.0.1:27003/api/logs/$id" | python3 -c "import json,sys; print(json.load(sys.stdin)['log'][-3000:])"
          done
          docker rm -f upscale-socket
          python3 -c "import json,sys; j=json.load(open('all.json'))['jobs']; sys.exit(0 if len(j) == 2 and all(x['status']=='completed' for x in j) else 1)"
          ls -la ci-data/out ci-data/out/*
          test -f ci-data/out/videos/clip.mkv && test -f ci-data/out/Series/episode.mkv
