name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint Python
        run: ruff check .
      - name: Tests
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JavaScript
        run: node --check static/app.js
      - name: Check installer
        run: |
          bash -n install.sh
          shellcheck install.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t uscale:ci .
      - name: Smoke test
        run: |
          docker run -d --name uscale-ci -p 27000:27000 uscale:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:27000/api/ping && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:27000/ | grep -q Uscale
          curl -fsS http://127.0.0.1:27000/api/config | grep -q '"version"'
          docker exec uscale-ci docker --version
          docker exec uscale-ci ffmpeg -hide_banner -encoders | grep -E "libx265|libsvtav1|hevc_vaapi"
          docker rm -f uscale-ci

  docker-local:
    # Variante sans socket Docker (Video2X AppImage dans l'image) : vérifie qu'elle se construit et démarre.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f Dockerfile.local -t uscale-local:ci .
      - name: Video2X runs
        run: |
          docker run --rm --entrypoint /opt/video2x/AppRun uscale-local:ci --help > help.txt
          cat help.txt
          grep -q -- "--list-devices" help.txt
          grep -q -- "--frame-rate-mul" help.txt
          for model in realesrgan-plus realesrgan-plus-anime realesr-animevideov3; do
            grep -q "$model" help.txt || { echo "Modèle absent : $model"; exit 1; }
          done
      - name: Real Video2X on CPU Vulkan (lavapipe)
        run: |
          docker run --rm --entrypoint sh -w /usr/share/video2x uscale-local:ci -c '
            set -e
            ls -la /usr/share/video2x/models/ /usr/share/video2x/models/realesrgan | head -n 30
            ffmpeg -v error -f lavfi -i testsrc=size=96x64:rate=10:duration=1 -c:v libx264 -pix_fmt yuv420p /tmp/in.mp4
            /opt/video2x/AppRun --list-devices
            /opt/video2x/AppRun -i /tmp/in.mp4 -o /tmp/up.mkv -p realesrgan -s 2 --realesrgan-model realesr-animevideov3 -c ffv1 2>&1 | tr "\r" "\n" | tail -n 25
            ffprobe -v error -show_entries stream=codec_name,width,height -of csv /tmp/up.mkv
            /opt/video2x/AppRun -i /tmp/in.mp4 -o /tmp/rife.mkv -p rife --frame-rate-mul 2 -c ffv1 2>&1 | tr "\r" "\n" | tail -n 10
            ffprobe -v error -show_entries stream=codec_name,avg_frame_rate,nb_frames -count_frames -of csv /tmp/rife.mkv
          '
      - name: Full pipeline with real Video2X (local mode)
        run: |
          mkdir -p ci-data/videos
          docker run --rm -v "$PWD/ci-data:/data" --entrypoint ffmpeg uscale-local:ci -v error \
            -f lavfi -i testsrc=size=160x120:rate=10:duration=3 -f lavfi -i sine=duration=3 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac /data/videos/clip.mp4
          docker run -d --name uscale-e2e -p 27002:27000 -v "$PWD/ci-data:/data" \
            -e USCALE_SEGMENT_SECONDS=1 -e USCALE_MIN_FREE_GB=0 uscale-local:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:27002/api/ping && break; sleep 1; done
          curl -fsS -X POST -H "Content-Type: application/json" http://127.0.0.1:27002/api/queue \
            -d '{"source":"/data/videos","destination":"/data/out","max_input_height":480,"output_height":240,"model":"realesr-animevideov3","preset":"ultrafast"}'
          status=""
          for i in $(seq 1 120); do
            sleep 5
            curl -fsS "http://127.0.0.1:27002/api/jobs" > jobs.json
            status=$(python3 -c "import json; j=json.load(open('jobs.json'))['jobs']; print(j[0]['status'] if j else '')")
            python3 -c "import json; j=json.load(open('jobs.json'))['jobs']; print(j and (j[0]['stage'], j[0]['progress']))"
            [ "$status" = completed ] || [ "$status" = failed ] && break
          done
          id=$(python3 -c "import json; print(json.load(open('jobs.json'))['jobs'][0]['id'])")
          curl -fsS "http://127.0.0.1:27002/api/logs/$id" | python3 -c "import json,sys; print(json.load(sys.stdin)['log'])"
          docker rm -f uscale-e2e
          test "$status" = completed
          docker run --rm -v "$PWD/ci-data:/data" --entrypoint ffprobe uscale-local:ci -v error \
            -show_entries stream=codec_type,codec_name,width,height:format=duration -of csv /data/out/clip.mkv
      - name: Smoke test
        run: |
          docker run -d --name uscale-local -p 27001:27000 uscale-local:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:27001/api/ping && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:27001/api/health | tee health.json
          grep -q '"runner":"local"' health.json
          grep -q '"image_present":true' health.json
          docker rm -f uscale-local
